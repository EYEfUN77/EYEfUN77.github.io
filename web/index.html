<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바탕화면 달력(iCalendar)</title>
<meta name="theme-color" content="#1f5fd1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="바탕화면 달력">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#1f5fd1}
/* 휴대폰 앱이 켜질 때 안드로이드가 먼저 보여 주는 첫 화면(파란 바탕 + 가운데 큰 아이콘)과 똑같이 맞춤 → 화면이 바뀌어도 덜컹거리지 않음 */
#ld{position:fixed;inset:0;background:#1f5fd1;display:flex;align-items:center;justify-content:center;color:#fff;font:600 16px/1.5 'Apple SD Gothic Neo','Noto Sans KR',sans-serif;text-align:center}
#ld img{width:300px;max-width:80vw;height:auto;display:block}
#msg{position:absolute;left:24px;right:24px;top:calc(50% + min(150px,40vw) + 18px);opacity:0;animation:msgIn .3s ease 1.2s forwards}
#msg.now{animation:none;opacity:1}
@keyframes msgIn{to{opacity:1}}
#ld small{font-weight:500;opacity:.85}
#ld button{margin-top:6px;border:0;border-radius:999px;padding:10px 20px;font:700 15px inherit;background:#fff;color:#1f5fd1}
</style>
</head>
<body>
<div id="ld"><img src="splash.png" alt=""><div id="msg">바탕화면 달력 불러오는 중…</div></div>
<script>
/* 바탕화면 달력 — 휴대폰·웹 버전(각자 자기 구글 계정으로 직접 연결)
   달력 화면은 서버에서 받아 이 기기에 저장해 두고, 일정은 gweb.js 가 내 구글 캘린더에서 직접 가져옵니다.
   (교수님 전용 /app 은 기존 서버 계정 방식 그대로) */
var API='https://script.google.com/macros/s/AKfycbwWQywc263qUTpraUo1FIfcllv1g02fnXgieYk25hT7kMHioN7Pc_HSfN2z9GQocKUN4Q/exec';
var GCFG={ clientId:'708739507297-bps68jed353ors03aq46h2r9e88va82e.apps.googleusercontent.com' };
var CK='dcal.uiCache', GK='dcal.gwebSrc';
var EN=(function(){ try{ var u=JSON.parse(localStorage.getItem('dcal.ui')||'null')||{}; if(u.lang) return u.lang==='en'; }catch(e){} return !/^ko/i.test(navigator.language||'ko'); })();
if(EN){ document.getElementById('msg').textContent='Loading Desktop Calendar…'; document.title='Desktop Calendar (iCalendar)'; }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

/* 구글 로그인에서 돌아온 경우(#access_token=… 또는 #error=…): 주소에서 지우고 따로 보관 */
var AUTH_HASH='';
if(/(^|[#&])(access_token|error)=/.test(location.hash)){ AUTH_HASH=location.hash; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }

function $(id){ return document.getElementById(id); }
function getCache(){ try{ var c=JSON.parse(localStorage.getItem(CK)||'null'); return isUi(c)?c:null; }catch(e){ return null; } }
function setCache(ui){ try{ localStorage.setItem(CK, JSON.stringify({ id:ui.id||'', html:ui.html })); }catch(e){} }
function isUi(ui){ return !!(ui && ui.html && String(ui.html).length>30000 && String(ui.html).indexOf('/*__CONFIG__*/')>=0); }
function withTimeout(p, ms){ return new Promise(function(res,rej){ var t=setTimeout(function(){ rej(new Error(EN?'Timed out':'시간 초과')); },ms); p.then(function(v){ clearTimeout(t); res(v); },function(e){ clearTimeout(t); rej(e); }); }); }
function getJson(action, ms){
  return withTimeout(fetch(API+'?action='+action+'&t='+Date.now(),{ redirect:'follow', cache:'no-store' }).then(function(r){ return r.json(); }), ms)
    .then(function(j){ if(!j || !j.ok) throw new Error((j&&j.error)||'서버 응답 오류'); return j.data; });
}
/* 구글 연결 코드(gweb.js): 인터넷이 되면 새로 받고, 안 되면 저장해 둔 것 */
function getGweb(){
  var saved=null; try{ saved=localStorage.getItem(GK); }catch(e){}
  if(saved && getCache()) return Promise.resolve(saved);   /* 저장본으로 바로 시작 */
  return withTimeout(fetch('gweb.js?t='+Date.now(),{ cache:'no-store' }).then(function(r){ if(!r.ok) throw new Error('gweb'); return r.text(); }), 6000)
    .then(function(t){ try{ localStorage.setItem(GK,t); }catch(e){} return t; })
    .catch(function(e){ var t=null; try{ t=localStorage.getItem(GK); }catch(x){} if(t) return t; throw e; });
}
var BOOT_HEAD="<style>html{background:#1f5fd1}#dcalBoot{position:fixed;inset:0;z-index:2147483647;background:#1f5fd1;display:flex;align-items:center;justify-content:center;transition:opacity .28s ease;pointer-events:none}#dcalBoot img{width:300px;max-width:80vw;height:auto;display:block}</style><script>(function(){var gone=false;function go(){if(gone)return;gone=true;var o=document.getElementById('dcalBoot');if(!o)return;requestAnimationFrame(function(){requestAnimationFrame(function(){o.style.opacity='0';setTimeout(function(){if(o.parentNode)o.parentNode.removeChild(o);document.documentElement.style.background='';},320);});});}function chk(){if(document.readyState!=='loading'&&document.querySelector('.widget'))go();else if(!gone)setTimeout(chk,30);}document.addEventListener('DOMContentLoaded',chk);setTimeout(chk,30);setTimeout(go,4000);})();<\/script>";
var BOOT_BODY="<div id=\"dcalBoot\"><img src=\"splash.png\" alt=\"\"></div>";
/* 화면·구글 연결 코드의 새 버전은 달력이 뜬 뒤 뒤에서 받아 두었다가 다음에 열 때 적용(시작할 때 기다리지 않음) */
function BG_UPDATE(){ return '<script>(function(){var API='+JSON.stringify(API)+',CK='+JSON.stringify(CK)+',GK='+JSON.stringify(GK)+';function ok(u){return !!(u&&u.html&&String(u.html).length>30000&&String(u.html).indexOf("/*__CONFIG__*/")>=0);}function j(a){return fetch(API+"?action="+a+"&t="+Date.now(),{redirect:"follow",cache:"no-store"}).then(function(r){return r.json();}).then(function(x){if(!x||!x.ok)throw 0;return x.data;});}setTimeout(function(){if(navigator.onLine===false)return;j("uiVersion").then(function(v){var c=null;try{c=JSON.parse(localStorage.getItem(CK)||"null");}catch(e){}if(!v||!v.id||(c&&c.id===v.id))return;return j("ui").then(function(u){if(ok(u))try{localStorage.setItem(CK,JSON.stringify({id:u.id||"",html:u.html}));}catch(e){}});}).catch(function(){});fetch("gweb.js?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){if(t&&t.length>1000)try{localStorage.setItem(GK,t);}catch(e){}}).catch(function(){});},5000);})();<\/script>'; }
var PWA_HEAD='<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f5fd1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="바탕화면 달력"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">';
function show(ui, gsrc, authErr){
  var inject='window.CAL_CONFIG='+JSON.stringify({ apiUrl:API })+';window.CAL_PWA=true;window.CAL_UI_ID='+JSON.stringify(ui.id||'')+';'+
    'window.GWEB_CONFIG='+JSON.stringify(GCFG)+';'+(authErr?'window.GWEB_AUTH_ERR='+JSON.stringify(authErr)+';':'')+'\n'+gsrc+'\n';
  var html=String(ui.html).replace('/*__CONFIG__*/', function(){ return inject; });
  /* 달력 화면으로 바꿔 쓸 때 설치 정보(manifest)가 사라지지 않게 다시 넣음 — 없으면 크롬이 '설치할 수 없음'으로 판단 */
  html=html.replace(/<head[^>]*>/i, function(m){ return m+PWA_HEAD+BOOT_HEAD+BG_UPDATE(); });
  html=html.replace(/<body[^>]*>/i, function(m){ return m+BOOT_BODY; });
  document.open(); document.write(html); document.close();
}
function fail(e){
  $('msg').className='now'; $('msg').innerHTML=(EN?'Could not load the calendar.':'달력을 불러오지 못했습니다.')+'<br><small>'+String((e&&e.message)||e).replace(/</g,'&lt;')+'<br>'+(EN?'Open it once with an internet connection first.':'처음 한 번은 인터넷이 연결된 상태에서 열어야 합니다.')+'</small><br><button onclick="location.reload()">'+(EN?'Try again':'다시 시도')+'</button>';
}
function loadUi(){
  var cached=getCache();
  if(cached) return Promise.resolve(cached);   /* 저장된 화면으로 바로 시작(새 버전은 뒤에서 받아 둠) */
  return getJson('uiVersion', 3500).then(function(v){
    if(cached && v && v.id && v.id===cached.id) return cached;
    return getJson('ui', 20000).then(function(ui){ if(!isUi(ui)) throw new Error('화면 파일이 올바르지 않습니다.'); setCache(ui); return ui; });
  }, function(e){
    if(cached) return cached;
    return getJson('ui', 20000).then(function(ui){ if(!isUi(ui)) throw e; setCache(ui); return ui; });
  });
}
function start(){
  var gsrc;
  getGweb().then(function(t){
    gsrc=t; window.GWEB_CONFIG=GCFG; (new Function(t))(); /* window.dcalApp 준비 */
    if(!AUTH_HASH) return '';
    return window.dcalApp.g.finishAuth(AUTH_HASH).then(function(r){ return r.ok?'':(r.error==='state'?'':r.error); }, function(e){ return String((e&&e.message)||e); });
  }).then(function(authErr){
    return loadUi().then(function(ui){ show(ui, gsrc, authErr); });
  }).catch(fail);
}
if(document.readyState==='complete') setTimeout(start,0); else window.addEventListener('load',start);
</script>
</body>
</html>
