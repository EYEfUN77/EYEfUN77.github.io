<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>테슬라로 목적지 보내기</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5b6475;--line:#e3e6ec;--accent:#e31937}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1e232b;--ink:#eef1f6;--muted:#a3abb9;--line:#2e3540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
.wrap{max-width:460px;margin:0 auto;padding:28px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
h1{font-size:1.25rem;margin:0 0 14px}
.n{font-weight:700;font-size:1.1rem;margin:0}
.a{color:var(--muted);margin:2px 0 4px;word-break:keep-all}
.g{color:var(--muted);font-size:.85rem;margin:0 0 14px}
button{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;text-align:left}
button small{display:block;font-weight:500;font-size:.8rem;opacity:.85;margin-top:2px}
.pri{background:var(--accent);color:#fff}
.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45}
ol{color:var(--muted);font-size:.9rem;padding-left:1.2em;margin:18px 0 0}
#msg{min-height:1.4em;color:var(--accent);font-size:.92rem;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>🚗 테슬라로 목적지 보내기</h1>
  <p class="n" id="n"></p>
  <p class="a" id="a"></p>
  <p class="g" id="g"></p>
  <button class="pri" id="bAddr">① 도로명 주소로 보내기<small>추천 — 주소 그대로 보냄</small></button>
  <button class="sec" id="bName">② 장소 이름으로 보내기<small>테슬라가 이름으로 찾아 표시(목록에서 고르기)</small></button>
  <button class="sec" id="bGeo">③ 좌표로 보내기<small>주소로 못 찾을 때 — 지번으로 표시됨</small></button>
  <button class="sec" id="bMap">④ 구글 지도 링크로 보내기</button>
  <button class="sec" id="bCopy">주소만 복사</button>
  <div id="msg"></div>
  <ol>
    <li>버튼을 누르면 휴대폰 공유창이 뜹니다.</li>
    <li>공유창에서 <b>Tesla</b> 앱을 고르면 차량 내비로 목적지가 전송됩니다.</li>
  </ol>
</div></div>
<script>
var API='https://script.google.com/macros/s/AKfycbwWQywc263qUTpraUo1FIfcllv1g02fnXgieYk25hT7kMHioN7Pc_HSfN2z9GQocKUN4Q/exec';
var p=new URLSearchParams(location.search), n=(p.get('n')||'').slice(0,200), a=(p.get('a')||n).slice(0,300), geo=null;
var gp=(p.get('g')||'').split(',');
if(gp.length===2 && isFinite(+gp[0]) && isFinite(+gp[1]) && +gp[0] && +gp[1]) geo=[(+gp[0]).toFixed(6),(+gp[1]).toFixed(6)];
var $=function(id){ return document.getElementById(id); }, msg=$('msg');
$('n').textContent=n||'목적지'; $('a').textContent=a;
function showGeo(){
  $('g').textContent=geo?('위치: '+geo[0]+', '+geo[1]):'정확한 위치를 찾는 중…';
  $('bGeo').disabled=$('bMap').disabled=!geo;
}
showGeo();
var noAddr=!p.get('a')||a===n;
if((!geo||noAddr) && (n||a)){ /* 좌표가 없으면 장소 이름으로 찾아봄 */
  fetch(API+'?action=place&q='+encodeURIComponent(n||a),{redirect:'follow'}).then(function(r){ return r.json(); }).then(function(j){
    var d=j && j.ok && j.data && j.data[0];
    if(d && noAddr && (d.road||d.addr)){ a=d.road||d.addr; $('a').textContent=a; }
    if(d && +d.y && +d.x){ if(!geo) geo=[(+d.y).toFixed(6),(+d.x).toFixed(6)]; showGeo(); }
    else if(!geo){ $('g').textContent='정확한 위치를 찾지 못했습니다. ① 주소 또는 ② 이름으로 보내기를 사용하세요.'; }
  }).catch(function(){ if(!geo) $('g').textContent='정확한 위치를 찾지 못했습니다. ① 주소 또는 ② 이름으로 보내기를 사용하세요.'; });
}
function copy(t){
  function old(){ var x=document.createElement('textarea'); x.value=t; document.body.appendChild(x); x.select(); try{document.execCommand('copy');}catch(e){} x.remove(); }
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){},old); else old();
}
function share(text){
  if(!navigator.share){ copy(text); msg.textContent='공유 기능이 없어 복사했습니다. Tesla 앱 검색에 붙여넣으세요.'; return; }
  navigator.share({ text:text }).catch(function(e){ if(e && e.name!=='AbortError'){ copy(text); msg.textContent='공유하지 못해 복사했습니다.'; } });
}
$('bGeo').onclick=function(){ if(geo) share(geo[0]+', '+geo[1]); };
$('bMap').onclick=function(){ if(geo) share('https://www.google.com/maps/search/?api=1&query='+geo[0]+','+geo[1]); };
$('bName').onclick=function(){ share(n||a); };
$('bAddr').onclick=function(){ share(a); };
$('bCopy').onclick=function(){ copy(a); msg.textContent='주소를 복사했습니다.'; };
</script>
</body>
</html>
